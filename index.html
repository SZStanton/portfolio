<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sebastian Stanton | Junior Full-Stack Developer</title>
    <meta
      name="description"
      content="Junior Full-Stack Developer in Cape Town, building with React, Node and MongoDB. Career changer with nine years in high-accuracy administration."
    />
    <meta name="author" content="Sebastian Stanton" />
    <!-- Tints the browser chrome on mobile to match the page. -->
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101011" media="(prefers-color-scheme: dark)" />

    <!-- What LinkedIn, Slack and the rest show when the link is shared.
         Without these a shared link is just a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sebastian Stanton | Junior Full-Stack Developer" />
    <meta
      property="og:description"
      content="Junior Full-Stack Developer in Cape Town, building with React, Node and MongoDB."
    />
    <meta property="og:site_name" content="Sebastian Stanton" />
    <meta property="og:url" content="https://portfolio-eight-smoky-41.vercel.app/" />
    <!-- Full https:// address, not a path. Some platforms refuse to
         resolve a relative one. -->
    <meta property="og:image" content="https://portfolio-eight-smoky-41.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sebastian Stanton, Junior Full-Stack Developer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://portfolio-eight-smoky-41.vercel.app/og-image.jpg" />
    <!-- Painted before the stylesheet has even downloaded, so the page starts
         on the right background instead of flashing white. These two values
         mirror --surface in index.css and must be changed alongside it. -->
    <style>
      /* Dark is the default here too, so the very first paint matches. */
      html {
        background-color: #101011;
      }
      html:not(.dark) {
        background-color: #f7f6f3;
      }
    </style>
    <!-- Runs before first paint, so there is no flash while React starts.
         Dark is the default, and only an explicit choice of light wins. -->
    <script>
      (() => {
        if (localStorage.getItem('theme') !== 'light') {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

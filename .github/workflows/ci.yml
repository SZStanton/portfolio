name: CI

# Runs on pushes to main and on every pull request into it, so a broken
# build is caught here rather than on Vercel.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # Caches ~/.npm between runs, which makes install much faster.
          cache: npm

      # ci installs exactly what package-lock.json specifies, unlike
      # install, which may quietly resolve to newer versions.
      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Also type-checks, since the build script runs tsc first.
      - name: Build
        run: npm run build
